# CodeQL static analysis (SAST).
# This repository is PowerShell + Power BI (PBIP) tooling; CodeQL analyses the
# repository's GitHub Actions workflows (language: actions), providing real SAST
# coverage of the CI supply chain and satisfying the OpenSSF Scorecard SAST check.
# Run as an explicit workflow (not default setup) so Scorecard detects CodeQL and
# so pull requests carry a CodeQL check (feeds the CI-Tests signal).
# Docs: https://github.com/github/codeql-action
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Saturday 02:30 UTC.
    - cron: '30 2 * * 6'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload CodeQL results to the Code Scanning dashboard.
      security-events: write
      packages: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: '/language:${{ matrix.language }}'
